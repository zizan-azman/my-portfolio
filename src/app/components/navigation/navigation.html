<nav class="navigation" aria-label="Main navigation">
  <ul class="navigation__list" role="list">
    @for (item of navigationData.links; track item.href) {
    <li class="navigation__item">
      <a
        class="navigation__link"
        [class.navigation__link--active]="active === item.href"
        [href]="'#' + item.href"
      >
        <div class="navigation__link-line"></div>
        <span class="navigation__link-text">{{ item.text }}</span>
      </a>
    </li>
    }
  </ul>
</nav>
