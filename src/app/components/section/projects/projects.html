<section class="projects" id="projects">
  <app-section-title title="Projects" />
  <ol role="list" class="projects__list">
    @for (item of projectsData.projects; track item) {
    <li class="projects__item">
      <div class="projects__project-item-container">
        <div class="projects__hover-background"></div>
        <div class="projects__img-container">
          <img
            src="{{ item.img.url }}"
            alt="{{ item.img.alt }}"
            class="projects__img"
          />
        </div>
        <div class="projects__project-item-content">
          <a
            href="{{ item.link.href }}"
            class="projects__project-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="projects__link-text">{{ item.link.text }}</span>
            <svg
              class="projects__link-icon"
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="currentColor"
            >
              <path
                d="m256-240-56-56 384-384H240v-80h480v480h-80v-344L256-240Z"
              />
            </svg>
          </a>
          <p class="projects__paragraph" [innerHTML]="item.paragraph"></p>
          <a
            href="{{ item.anotherLink?.href }}"
            class="projects__another-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="projects__another-link-text-icon-container">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="projects__another-link-icon"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"
                />
              </svg>
              <span class="projects__another-link-text">{{
                item.anotherLink?.text
              }}</span>
            </div>
            <div class="projects__another-link-underline"></div>
          </a>

          <ul
            role="list"
            class="projects__tags-container"
            aria-label="Technologies used"
          >
            @for (tag of item.tags; track tag) {
            <li class="projects__tag-item">
              <div class="projects__tag">{{ tag }}</div>
            </li>
            }
          </ul>
        </div>
      </div>
    </li>
    }
  </ol>
</section>
